[project]
name = "millionairemind-backend"
version = "0.1.0"
description = "MillionaireMind — autonomous, research-gated capital compounding platform (paper mode)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
